[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cratedigger"
version = "0.2.0"
description = "Personal music collection management pipeline, audio analyzer, and web UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
mb = [
    "pyacoustid>=1.3",
    "musicbrainzngs>=0.7",
]
audio = [
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "onnxruntime>=1.16",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
cratedigger = "cratedigger.cli:main"

[tool.setuptools.packages.find]
include = ["cratedigger*", "lib*"]
