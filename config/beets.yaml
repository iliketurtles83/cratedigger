# cratedigger / beets integration config
# Configured for Tier 1 Artist-Root + Letter Bucketing contract

directory: /media/jack/buffer/audio
library: /home/jack/.config/beets/library.db

art_filename: cover

plugins:
  - musicbrainz   # MusicBrainz metadata source
  - chroma        # AcoustID audio fingerprinting
  - fromfilename  # Fallback when tags are empty
  - info          # Command-line inspection
  - fetchart      # Automatic album art retrieval

fetchart:
  auto: yes
  cautious: yes
  cover_names:
    - cover
    - front
    - folder
    - albumart
  sources:
    - filesystem
    - coverart
    - itunes
    - amazon
  maxwidth: 1200
  enforce_ratio: yes
  cover_format: JPEG

import:
  autotag: yes    # Enable MusicBrainz / AcoustID metadata matching
  copy: no
  move: no        # Cratedigger exclusively owns filename and path changes
  write: yes      # Write canonical tags + MBIDs to audio files
  incremental: yes
  quiet: no       # Allow interactive resolution in terminal; scripts pass -q
  quiet_fallback: asis
  timid: no       # Only prompt when match confidence is ambiguous
  duplicate_action: ask
  ignored_extensions:
    - vdjstems
    - asx
    - mpg
    - mpeg
  ignore:
    - '.*'
    - '*~'
    - '*.vdjstems'
    - '0videos'

# Chroma / AcoustID settings
chroma:
  auto: yes

# MusicBrainz API rate limiting (respecting MB terms)
musicbrainz:
  ratelimit: 1.0

# Matching distance thresholds
match:
  strong_rec_thresh: 0.15 # Confident matches applied automatically in quiet mode
  medium_rec_thresh: 0.25
